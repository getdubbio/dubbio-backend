name: dubbio

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dubbio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dubbio}
      POSTGRES_DB: ${POSTGRES_DB:-dubbio}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 keeps PGDATA under /var/lib/postgresql/18/docker.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: dubbio-api:dev
    build:
      context: .
      target: development
    command:
      [
        "sh",
        "-c",
        "pnpm install --frozen-lockfile && pnpm db:migrate && exec pnpm start:dev",
      ]
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-dubbio}:${POSTGRES_PASSWORD:-dubbio}@db:5432/${POSTGRES_DB:-dubbio}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
      - "127.0.0.1:4983:4983"
    volumes:
      - .:/app:Z
      # npm dependencies live in the volume, not on the host.
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm-store
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped

volumes:
  postgres_data:
  node_modules:
  pnpm_store:
