name: dubbio

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dubbio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dubbio}
      POSTGRES_DB: ${POSTGRES_DB:-dubbio}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 keeps PGDATA under /var/lib/postgresql/18/docker.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: dubbio-api:dev
    build:
      context: .
      target: development
    command: [ "pnpm", "dev" ]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dubbio}:${POSTGRES_PASSWORD:-dubbio}@db:5432/${POSTGRES_DB:-dubbio}
      REDIS_URL: redis://redis:6379
      PROVIDERS_MODE: ${PROVIDERS_MODE:-mock}
      PORT: 3000
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./nest-cli.json
        - action: rebuild
          path: ./tsconfig.json
        - action: rebuild
          path: ./tsconfig.build.json
    init: true
    restart: unless-stopped

  worker:
    image: dubbio-api:dev
    build:
      context: .
      target: development
    command: [ "pnpm", "dev:worker" ]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dubbio}:${POSTGRES_PASSWORD:-dubbio}@db:5432/${POSTGRES_DB:-dubbio}
      REDIS_URL: redis://redis:6379
      PROVIDERS_MODE: ${PROVIDERS_MODE:-mock}
    depends_on:
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./nest-cli.json
        - action: rebuild
          path: ./tsconfig.json
        - action: rebuild
          path: ./tsconfig.build.json
    init: true
    restart: unless-stopped

  redis:
    image: redis:7.4
    command: [ "redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction" ]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
